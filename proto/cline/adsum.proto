syntax = "proto3";

package cline;

import "cline/common.proto";

option go_package = "github.com/cline/grpc-go/cline";
option java_multiple_files = true;
option java_package = "bot.cline.proto";

// Adsum-specific services (free-tier invite codes, etc.) — not part of upstream Cline.
service AdsumService {
  // Redeems an invite code for extra free-tier tokens.
  // Request value is the raw code; response value is a JSON-encoded
  // { grantedTokens, newQuota, sourceLabel }.
  rpc redeemInviteCode(StringRequest) returns (String);

  // Opens the browser at the sign-in page for a provider ("github" | "google" | "email").
  // The one-time code comes back through the vscode:// URI handler, never through this call.
  // Response value is "" on success, or a short reason the browser could not be opened.
  rpc startSignIn(StringRequest) returns (String);

  // Completes a sign-in from the link pasted into the panel's waiting view, through the same exchange the
  // vscode:// callback uses. Request value is the pasted text. Response value is JSON {ok, message}.
  rpc pasteSignInLink(StringRequest) returns (String);

  // The panel-header account icon asks the panel to act: "signin" opens the sign-in window, "settings" shows the
  // Account section, "signout" shows the Account section's sign-out confirmation.
  rpc subscribeToAccountAction(EmptyRequest) returns (stream String);

  // Ends the session here and on the server, so a lost machine actually loses access.
  rpc signOutAccount(EmptyRequest) returns (Empty);

  // Re-reads the profile now (the panel does this when it is shown, and after a grant is expected).
  rpc refreshAccount(EmptyRequest) returns (Empty);

  // Deletes the account and everything keyed on the person, then signs out locally.
  // Irreversible; the panel confirms before calling it. Response value is "" on success.
  rpc deleteAccount(EmptyRequest) returns (String);

  // Asks for access to a template-source family. Request value is JSON {family, chips[], message}.
  // Response value is JSON {ok} or {ok:false, reason}.
  rpc requestAccess(StringRequest) returns (String);

  // [0.5 sessions first] The rail asks the host to open a session as an editor tab.
  // Request value is JSON {taskId?, prompt?, send?, title?}: an existing session is focused, never opened
  // twice; a prompt is sent as the first message when `send`, else placed in the composer.
  // Response value is the task id, or "" when nothing started.
  rpc openSession(StringRequest) returns (String);

  // [0.5 the firmware lane] The Hardware page's door to licensed firmware. Request value is JSON
  // {op:"list", family?} | {op:"download", id, version, folder?, pick?} | {op:"open-folder", folder}.
  // Response value is JSON: {ok, rows[]} for list; {ok, local} or {ok:false, locked, group} for download.
  rpc firmware(StringRequest) returns (String);
}
